<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create a ViCom account.">
  <title>ViCom | Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="../theme.css">
  <script src="../theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../LandingPage/index.html" aria-label="ViCom home"><span class="brand-mark">V</span><span>ViCom</span></a>
    <a class="back-link" href="../LandingPage/index.html">Back to ViCom <span>↗</span></a>
  </header>

  <main class="auth-layout">
    <section class="auth-intro">
      <p class="eyebrow"><span></span> A home for original work</p>
      <h1>Find your<br><em>ideas</em> come to life.</h1>
      <p>Look for artists, share your ideas, and keep every commission in one place.</p>
    </section>

    <section class="auth-card" aria-labelledby="form-title">
      <div class="mode-tabs" role="tablist" aria-label="Account actions">
        <button class="mode-tab active" type="button" data-mode="signin">Log in</button>
        <button class="mode-tab" type="button" data-mode="signup">Create account</button>
        <button class="mode-tab" type="button" data-mode="artist">Join as artist</button>
      </div>
      <div class="form-heading">
        <p class="eyebrow" id="form-eyebrow"><span></span> Welcome back</p>
        <h2 id="form-title">Log in to ViCom</h2>
        <p id="form-description">Continue exploring artists and managing your commissions.</p>
      </div>
      <form id="auth-form" novalidate>
        <div class="field name-field" hidden>
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="How should we call you?">
        </div>
        <div class="field artist-only" hidden>
          <label for="artist-name">Artist or studio name</label>
          <input id="artist-name" name="artistName" type="text" autocomplete="organization" placeholder="e.g. Haru Studio">
        </div>
        <div class="field artist-only" hidden>
          <label for="specialty">Primary specialty</label>
          <input id="specialty" name="specialty" type="text" placeholder="e.g. Portrait illustration">
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required>
            <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="field confirm-password-field" hidden>
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" minlength="6">
        </div>
        <button class="forgot-password" id="forgot-password" type="button">Forgot password?</button>
        <div class="terms-field" id="terms-field" hidden>
          <input id="terms-agree" name="termsAgree" type="checkbox">
          <div class="terms-copy">
            <label for="terms-agree">I agree to the</label>
            <button class="terms-link" type="button" data-terms-open>Terms and Conditions</button> and
            <button class="terms-link" type="button" data-privacy-open>Privacy Policy</button>.
          </div>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <button class="submit-button" type="submit" id="submit-button">Log in <span>↗</span></button>
      </form>
      <p class="switch-copy" id="switch-copy">New to ViCom? <button type="button" data-mode="signup">Create an account</button></p>
    </section>
  </main>
  <div class="legal-modal" id="legal-modal" hidden>
    <div class="legal-card" role="dialog" aria-modal="true" aria-labelledby="legal-title">
      <button class="legal-close" id="legal-close" type="button" aria-label="Close">×</button>
      <h2 id="legal-title">Terms and Conditions</h2>
      <div class="legal-body" id="legal-body"></div>
      <button class="legal-accept" id="legal-accept" type="button">Got it</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="auth.js"></script>
</body>
</html>
